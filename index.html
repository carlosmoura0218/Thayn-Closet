<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Thayná Closet — moda que traduz seu estilo.">

<title>Thayná Closet</title>


<style>

:root{
--bege:#f7f0e8;
--bege2:#efe2d5;
--rose:#b88978;
--marrom:#5a4035;
--texto:#3f3029;
--branco:#fffdfb;
--claro:#faf6f2;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--branco);
color:var(--texto);
line-height:1.5;
}

a{
text-decoration:none;
color:inherit;
}

button{
font:inherit;
border:0;
cursor:pointer;
}


/* =========================
   TOPO
========================= */

.topo{
position:sticky;
top:0;
z-index:100;
background:#fffdfbf5;
backdrop-filter:blur(10px);
border-bottom:1px solid #eadbd0;
}

.nav{
max-width:1180px;
margin:auto;
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}

.logo{
font:27px Georgia,serif;
color:var(--marrom);
text-align:center;
}

.logo small{
display:block;
font:8px Arial,sans-serif;
letter-spacing:3px;
color:var(--rose);
margin-top:2px;
}

.icon{
width:42px;
height:42px;
border-radius:50%;
background:var(--bege);
color:var(--marrom);
font-size:19px;
}

.actions{
display:flex;
gap:9px;
}


/* =========================
   BUSCA
========================= */

.search{
display:none;
padding:12px;
background:white;
border-bottom:1px solid #eadbd0;
text-align:center;
}

.search input{
width:min(700px,90%);
padding:13px 18px;
border:1px solid #decfc4;
border-radius:25px;
outline:none;
font-size:15px;
}


/* =========================
   MENU LATERAL
========================= */

.side{
position:fixed;
top:0;
left:-310px;
width:290px;
height:100vh;
background:#fffdfb;
z-index:200;
padding:25px;
box-shadow:8px 0 30px #0002;
transition:.25s;
overflow-y:auto;
}

.side.open{
left:0;
}

.side h2{
font:26px Georgia,serif;
color:var(--marrom);
margin:35px 0 18px;
}

.side a{
display:block;
padding:13px 0;
border-bottom:1px solid #eee1d8;
}

.close{
float:right;
background:none;
font-size:28px;
color:var(--marrom);
}

.overlay{
display:none;
position:fixed;
inset:0;
background:#0006;
z-index:150;
}

.overlay.open{
display:block;
}


/* =========================
   HERO
========================= */

.hero{
background:linear-gradient(120deg,var(--bege),#fffaf6);
}

.hero-in{
max-width:1180px;
margin:auto;
padding:75px 20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:45px;
align-items:center;
}

.hero h1{
font:normal clamp(44px,6vw,72px) Georgia,serif;
color:var(--marrom);
line-height:1.05;
}

.hero p{
margin:20px
